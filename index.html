<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Local weather, hourly outlook, and a multi-day forecast.">
    <title>Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>

<body class="is-loading" data-theme="day">
    <div class="sky-overlay" aria-hidden="true"></div>

    <video id="background" class="bg-video" autoplay muted loop playsinline>
        <source id="backgroundsource" src="videos/dayTime.mp4" type="video/mp4">
    </video>

    <div class="app">
        <header class="topbar">
            <a class="brand" href="./">Weather</a>

            <form class="search" id="searchForm" role="search" autocomplete="off">
                <label class="sr-only" for="userLocation">Search city</label>
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
                    <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <input type="text" name="userLocation" id="userLocation" placeholder="Search a city…"
                    autocomplete="off" spellcheck="false">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </header>

        <div class="status-line" id="statusLine" role="status" aria-live="polite">
            <span class="loader" aria-hidden="true"></span>
            <span class="status-text">Fetching the sky…</span>
        </div>

        <main class="content" id="weatherContent" hidden>
            <section class="hero" aria-labelledby="city">
                <div class="hero-top">
                    <p class="hero-meta">
                        <span id="date">—</span>
                        <span class="dot" aria-hidden="true"></span>
                        <span id="time">—</span>
                    </p>
                    <p id="region" class="hero-region">—</p>
                </div>

                <div class="hero-main">
                    <div class="hero-copy">
                        <h1 id="city">—</h1>
                        <p id="status" class="condition">—</p>
                    </div>

                    <div class="hero-temp" aria-live="polite">
                        <img id="timeIcon" class="condition-icon" src="" alt="" width="64" height="64">
                        <div class="temp-block">
                            <span id="temp" class="temp-value">—</span>
                            <span class="temp-unit">°</span>
                        </div>
                        <p id="hiLo" class="hi-lo">H — · L —</p>
                    </div>
                </div>
            </section>

            <section class="metrics" aria-label="Current conditions">
                <div class="metric">
                    <span class="metric-label">Feels like</span>
                    <span id="feelsLike" class="metric-value">—</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Wind</span>
                    <span id="wind" class="metric-value">—</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Humidity</span>
                    <span id="humidity" class="metric-value">—</span>
                </div>
                <div class="metric">
                    <span class="metric-label">UV index</span>
                    <span id="uv" class="metric-value">—</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Visibility</span>
                    <span id="visibility" class="metric-value">—</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Pressure</span>
                    <span id="pressure" class="metric-value">—</span>
                </div>
            </section>

            <section class="panel" aria-labelledby="hourlyTitle">
                <div class="panel-head">
                    <h2 id="hourlyTitle">Next 24 hours</h2>
                    <p class="panel-hint">Drag to browse</p>
                </div>
                <div class="hourly-track" id="hourlyTrack" tabindex="0"></div>
            </section>

            <section class="panel" aria-labelledby="dailyTitle">
                <div class="panel-head">
                    <h2 id="dailyTitle">Coming days</h2>
                </div>
                <div class="daily-list" id="dailyList"></div>
            </section>
        </main>
    </div>

    <script src="script/forcast.js"></script>
    <script src="script/app.js"></script>
</body>

</html>
